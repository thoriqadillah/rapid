version: "3"

tasks:
  default:
    desc: Run the app
    cmd: task dev

  dev:
    desc: Run the app in development
    cmd: go run .

  build:
    desc: Build standalone binary
    cmd: go build -ldflags "-s -w" -o dist/rapid .
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - dist/rapid

  build:icon:
    desc: Generate the embedded MIQT icon resource wrapper
    dir: "{{.ROOT_DIR}}"
    cmd: |
      set -eu
      if command -v rcc >/dev/null 2>&1; then
        RCC="$(command -v rcc)"
      elif [ -x ".venv/lib/python3.13/site-packages/PySide6/Qt/libexec/rcc" ]; then
        RCC=".venv/lib/python3.13/site-packages/PySide6/Qt/libexec/rcc"
      elif [ -x ".venv/Scripts/rcc.exe" ]; then
        RCC=".venv/Scripts/rcc.exe"
      else
        echo "Qt rcc was not found." >&2
        echo "Install the required binary with:" >&2
        echo "  python3 -m pip install \"PySide6>=6.8,<7.0\"" >&2
        echo "Then rerun: task build:icon" >&2
        exit 1
      fi

      go run github.com/mappu/miqt/cmd/miqt-rcc \
        -Input assets/icons/icons.qrc \
        -OutputGo widget/ui/resources_generated.go \
        -OutputRcc widget/ui/resources.rcc \
        -Package widget/ui \
        -Qt6 \
        -RccBinary "$RCC"

      tmp="$(mktemp)"
      trap 'rm -f "$tmp"' EXIT
      {
        echo '// Code generated by miqt-rcc; DO NOT EDIT.'
        grep -v '^//go:generate ' ui/resources_generated.go
      } >"$tmp"
      mv "$tmp" widget/ui/resources_generated.go
      gofmt -w widget/ui/resources_generated.go
      trap - EXIT

  test:
    desc: Run tests
    cmd: go test ./...
