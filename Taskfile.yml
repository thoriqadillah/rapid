version: "3"

tasks:
  default:
    desc: Run the app
    cmd: task dev

  dev:
    desc: Run the app in development
    cmd: go run .

  build:
    desc: Build standalone binary
    cmd: go build -ldflags "-s -w" -o dist/rapid .
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - dist/rapid

  build:icon:
    desc: Generate the embedded MIQT icon resource wrapper
    dir: "{{.ROOT_DIR}}"
    cmd: |
      set -eu
      # Prefer Qt's own rcc so building the Go app does not require Python.
      RCC=""
      for candidate in rcc rcc-qt6 /usr/lib/qt6/libexec/rcc /usr/lib64/qt6/libexec/rcc /usr/libexec/qt6/rcc; do
        if command -v "$candidate" >/dev/null 2>&1; then
          RCC="$(command -v "$candidate")"
          break
        fi
      done
      # Legacy fallback: rcc shipped inside a PySide6 virtualenv.
      if [ -z "$RCC" ] && [ -x ".venv/lib/python3.13/site-packages/PySide6/Qt/libexec/rcc" ]; then
        RCC=".venv/lib/python3.13/site-packages/PySide6/Qt/libexec/rcc"
      fi
      if [ -z "$RCC" ] && [ -x ".venv/Scripts/rcc.exe" ]; then
        RCC=".venv/Scripts/rcc.exe"
      fi
      if [ -z "$RCC" ]; then
        echo "Qt rcc was not found." >&2
        echo "Install Qt's resource compiler (Debian/Ubuntu: qt6-base-dev-tools; Fedora: qt6-qtbase-devel)," >&2
        echo "or use the PySide6 fallback:" >&2
        echo "  python3 -m pip install \"PySide6>=6.8,<7.0\"" >&2
        exit 1
      fi

      go run github.com/mappu/miqt/cmd/miqt-rcc \
        -Input assets/icons/icons.qrc \
        -OutputGo widget/ui/resources_generated.go \
        -OutputRcc widget/ui/resources.rcc \
        -Package ui \
        -Qt6 \
        -RccBinary "$RCC"

      tmp="$(mktemp)"
      trap 'rm -f "$tmp"' EXIT
      {
        echo '// Code generated by miqt-rcc; DO NOT EDIT.'
        grep -v '^//go:generate ' widget/ui/resources_generated.go
      } >"$tmp"
      mv "$tmp" widget/ui/resources_generated.go
      gofmt -w widget/ui/resources_generated.go
      trap - EXIT

  test:
    desc: Run tests
    env:
      QT_QPA_PLATFORM: offscreen
    cmd: go test ./...

  test:race:
    desc: Run tests with the race detector
    env:
      QT_QPA_PLATFORM: offscreen
    cmd: go test -race ./...

  seed:
    desc: Seed demo downloads into the app database
    cmd: go run ./cmd/seed
